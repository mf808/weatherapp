# Production compose for the NAS — pulls the pre-built image from GHCR instead of
# building from source. Watchtower auto-deploys new `:latest` releases.
#
# One-time setup on the NAS:
#   1. Put this file at /volume3/docker/composers/weather/docker-compose.yaml
#   2. Create /volume3/docker/composers/weather/.env with the secrets below and
#      chmod 600 it. It must sit NEXT TO this compose file — docker compose only
#      auto-loads .env from the project directory, not from the data volume.
#   3. docker compose pull && docker compose up -d
#
# After that, deploys are automatic: a merge to main publishes a new image and
# Watchtower picks it up within the poll interval. To roll back, run ./rollback.sh.

services:
  weather:
    image: ghcr.io/mf808/weatherapp:latest
    container_name: weather
    restart: unless-stopped
    volumes:
      - /volume3/docker/weather/data/config.yaml:/app/config.yaml:ro
      - /volume3/docker/weather/data/creds.json:/app/creds.json:rw
      - /volume3/docker/weather/data/weather-script-output.png:/app/weather-script-output.png:rw
    ports:
      - 81:8080
    environment:
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - DEVICE_ID=${DEVICE_ID}
      - OUTDOOMODULE_ID=${OUTDOOMODULE_ID}
      - OPENWEATHERMAP_APPID=${OPENWEATHERMAP_APPID}
      - TZ=Europe/Berlin
    mem_limit: 128M
    mem_reservation: 64M
    labels:
      # Opt this container in to Watchtower's watch list.
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # Actively maintained fork of the dormant containrrr/watchtower (last release
    # 2023). Drop-in compatible: same flags, same com.centurylinklabs.* labels.
    image: ghcr.io/nicholas-fedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # --label-enable: only touch containers that opted in (the label above), so
    #   Watchtower never restarts your other NAS containers.
    # --interval 300: check GHCR every 5 minutes. --cleanup: prune old images.
    command: --label-enable --cleanup --interval 300
