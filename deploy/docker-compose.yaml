# Production compose for the NAS — pulls the pre-built image from GHCR instead of
# building from source.
#
# One-time setup on the NAS:
#   1. Put this file at /volume3/docker/composers/weather/docker-compose.yaml
#   2. Create /volume3/docker/composers/weather/.env with the AZURE_* bootstrap
#      credential below (from sp-nas-reader.env, see ../../azure/secrets-infra)
#      and chmod 600 it. It must sit NEXT TO this compose file — docker compose
#      only auto-loads .env from the project directory, not from the data volume.
#      The entrypoint (entrypoint.py) uses this to fetch the real app secrets
#      from Key Vault at every container start — nothing else needs to go in
#      this .env.
#   3. docker compose pull && docker compose up -d
#
# Auto-deploy: Watchtower runs as its own compose project on the NAS
# (/volume3/docker/composers/watchtower/) with two scoped instances:
#   scope=fast    → polls every 5 min (this app: a merge to main reaches the
#                   display within ~5 minutes of the image publish)
#   scope=nightly → daily 04:00 window for restart-sensitive apps
# The label below opts this container into the fast scope. To roll back to a
# pinned version, run ./rollback.sh.

services:
  weather:
    image: ghcr.io/mf808/weatherapp:latest
    container_name: weather
    restart: unless-stopped
    volumes:
      - /volume3/docker/weather/data/config.yaml:/app/config.yaml:ro
      - /volume3/docker/weather/data/creds.json:/app/creds.json:rw
      - /volume3/docker/weather/data/weather-script-output.png:/app/weather-script-output.png:rw
    ports:
      - 81:8080
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - TZ=Europe/Berlin
    mem_limit: 128M
    mem_reservation: 64M
    labels:
      # Auto-updated by the NAS-wide watchtower-fast instance (5-min polls).
      - com.centurylinklabs.watchtower.scope=fast
