version: 2
updates:
  # Python dependencies — bumps flow through the same gated CI pipeline as any change.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"          # dependency bumps land as patch releases
      include: scope

  # Keep the workflow actions themselves current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
