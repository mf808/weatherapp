name: Dependabot auto-merge

# Every Dependabot PR — any ecosystem, any bump level (patch / minor / major) — is
# set to auto-merge with no human or Claude interaction. The CI gate (the full test
# suite, including the visual regression test) is the sole decider: GitHub merges the
# PR the moment CI passes, and never before.
#
# A bump that changes the rendered display turns the visual test red, so it is held
# automatically for review (regenerate the golden) rather than merged — which is the
# rule "merge as long as the tests still work" doing exactly its job.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (CI decides the actual merge)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
